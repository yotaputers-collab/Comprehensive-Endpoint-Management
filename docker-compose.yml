services:
  # PostgreSQL Database
  postgres:
    image: postgres:13
    container_name: endpoint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: endpoint_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application
  app:
    build: .
    container_name: endpoint-management
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: endpoint_management
      DB_SYNCHRONIZE: "true"
      DB_LOGGING: "false"
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}
      JWT_EXPIRES_IN: 1h
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      BCRYPT_ROUNDS: 10
      DLp_RETENTION_PERIOD: 90
      DLp_REAL_TIME_MONITORING: true
      VULNERABILITY_SCAN_INTERVAL: 3600000
      VULNERABILITY_AUTO_REMEDIATION: false
      ISO27001_ENABLED: true
      AUDIT_RETENTION_DAYS: 365
    ports:
      - "3000:3000"
      - "3001:3001"

  # Redis (optional, for caching and rate limiting)
  redis:
    image: redis:7-alpine
    container_name: endpoint-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
