services:
  # PostgreSQL Database
  postgres:
    image: postgres:13
    container_name: endpoint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: endpoint_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application
  app:
    build: .
    container_name: endpoint-management
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: endpoint_management
      DB_SYNCHRONIZE: "true"
      DB_LOGGING: "false"
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-10}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      AGENT_ENROLL_TOKEN: ${AGENT_ENROLL_TOKEN:-}
      AGENT_ONLINE_WINDOW_MS: ${AGENT_ONLINE_WINDOW_MS:-120000}
      OSV_API_BASE: ${OSV_API_BASE:-https://api.osv.dev}
      OSV_TTL_HOURS: ${OSV_TTL_HOURS:-24}
      OSV_DETAIL_CONCURRENCY: ${OSV_DETAIL_CONCURRENCY:-4}
      SCAN_INTERVAL_MINUTES: ${SCAN_INTERVAL_MINUTES:-1440}
      SCAN_STALE_AFTER_MINUTES: ${SCAN_STALE_AFTER_MINUTES:-1440}
      SCAN_MAX_HOSTS_PER_RUN: ${SCAN_MAX_HOSTS_PER_RUN:-50}
      SCAN_WORKER_INTERVAL_MS: ${SCAN_WORKER_INTERVAL_MS:-5000}
      SCAN_JOB_STALE_MS: ${SCAN_JOB_STALE_MS:-300000}
      SCAN_JOB_MAX_ATTEMPTS: ${SCAN_JOB_MAX_ATTEMPTS:-3}
      BCRYPT_ROUNDS: 10
      DLp_RETENTION_PERIOD: 90
      DLp_REAL_TIME_MONITORING: true
      VULNERABILITY_SCAN_INTERVAL: 3600000
      VULNERABILITY_AUTO_REMEDIATION: false
      ISO27001_ENABLED: true
      AUDIT_RETENTION_DAYS: 365
    ports:
      - "3000:3000"
      - "3001:3001"

  # Redis (optional, for caching and rate limiting)
  redis:
    image: redis:7-alpine
    container_name: endpoint-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
